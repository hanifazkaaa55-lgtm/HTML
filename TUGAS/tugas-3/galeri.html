<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Karya Santri</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
      color: #333;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 28px;
      color: #1a237e;
    }

    h2 {
      font-size: 18px;
      color: #777;
      margin-top: 5px;
      font-weight: normal;
    }

    /* Navigasi */
    nav {
      margin: 20px 0;
    }

    nav a {
      text-decoration: none;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px 16px;
      margin: 5px;
      border-radius: 20px;
      color: #333;
      font-weight: bold;
    }

    nav a.active {
      background: #1a237e;
      color: #fff;
    }

    /* Section */
    .section {
      max-width: 900px;
      margin: 30px auto;
      text-align: left;
    }

    .section h3 {
      color: #1a237e;
      margin-bottom: 15px;
      border-left: 4px solid gold;
      padding-left: 10px;
    }

    /* Card Grid */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .card p {
      padding: 10px;
      font-size: 14px;
      color: #333;
    }

    /* Video */
    .video-container {
      text-align: center;
    }

    .video-container iframe {
      width: 100%;
      max-width: 600px;
      height: 340px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Galeri Karya Santri</h1>
  <h2>Karya Pertama: Website Profil Pribadi</h2>

  <!-- Navigasi -->
  <nav>
    <a href="index.html">Beranda</a>
    <a href="biodata.html">biodata</a>
    <a href="jadwal.html">Jadwal</a>
    <a href="galeri.html" class="active">galeri</a>
    <a href="feedback.html">Feedback</a>
  </nav>

  <!-- Karya Desain -->
  <div class="section">
    <h3>Karya Desain</h3>
    <div class="card-container">
      <div class="card">
        <img src="../../IMAGES/photo_2025-09-23_07-37-53.jpg" alt="">
        <p>Foto saat belajar bersama di lab komputer.</p>
      </div>
      <div class="card">
        <img src="../../IMAGES/photo_2025-09-23_07-37-56.jpg" alt="">
        <p>Draft awal desain logo profil.</p>
      </div>
      <div class="card">
        <img src="../../IMAGES/photo_2025-09-26_06-49-23.jpg" alt="HTML">
        <p>Tampilan hasil coding HTML.</p>
      </div>
      <div class="card">
        <img src="../../IMAGES/photo_2025-09-26_06-49-06.jpg" alt="Asrama">
        <p>Dokumentasi video singkat di asrama.</p>
      </div>
    </div>
  </div>

  <!-- Karya Video -->
  <div class="section">
    <h3>Karya Video</h3>
    <div class="video-container">
      <iframe src="https://jam.dev/c/21386966-a99d-4d9d-b0fe-3346c6cf7d17" 
              title="video-container" frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
