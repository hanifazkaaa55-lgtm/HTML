 <!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- container = jarak kiri kanan -->
    <!-- mx-auto = margin left right auto = biar ketengah -->
    <!-- p-4 = padding 1 rem (16px) -->
    <!-- bg-blue-300 = background biru kecerahan 300 -->
    <div class="container mx-auto px-4 bg-blue-300">
      <h1 class="text-3xl font-extrabold underline">Hello world!</h1>
      <br />
      <!-- atyling buttons -->
      <!-- hover: => saat di arahkan -->
      <!-- rounded-full => border radius bulat -->
      <!-- px-5 => padding (left-right) -->
      <!-- py-2 => padding (top-bottom) -->
      <!-- text-sm => text small (kecil) -->
      <!-- font-semibold => font agak tebal -->
      <button
        type="button"
        class="bg-green-600 hover:bg-red-700 text-white rounded-full px-5 py-2 text-sm leading-5 font-semibold"
      >
        Simpan Data
      </button>
      <br /><br />
      <!-- FLEXBOX BASIC DI TAILWIND -->
      <!-- wajib ada class flex => display: flex; -->
      <!-- flex-col : flex direction column (mobile) -->
      <!-- md:flex-row : flex direction row (medium++) -->
      <!-- gap-4 : jarak antar flex item -->
      <div class="flex flex-col md:flex-row gap-4">
        <div class="bg-green-200 p-4 flex-1">Box 1</div>
        <div class="bg-green-300 p-4 flex-1">Box 2</div>
        <div class="bg-green-400 p-4 flex-1">Box 3</div>
        <div class="bg-green-500 p-4 flex-1">Box 4</div>
      </div>

      <br />
      <br />
      <br />
      <!-- GRID BASIC DI TAILWIND -->
      <!-- wajib ada class grid => display: grid; -->
      <!-- grid-cols: atur jumlah kolom -->
      <div class="grid grid-cols-4 gap-6 p-6">
        <div class="bg-red-300 p-4 rounded-md">Card 1</div>
        <div class="bg-orange-300 p-4 rounded-md">Card 2</div>
        <div class="bg-yellow-300 p-4 rounded-md">Card 3</div>
        <div class="bg-teal-300 p-4 rounded-md">Card 4</div>
      </div>

      <!-- navbar menu -->
      <header>
        <!-- mx-auto: margin left-right: auto (agar element ketengah) -->
        <!-- justify-between : item rata kiri kanan -->
        <div class="flex mx-auto p-4 bg-indigo-800 justify-between rounded-md">
          <!-- judul halaman website -->
          <div class="text-xl text-white">Warung Semesta</div>

          <!-- navigasi utama -->
          <!-- hidden :  -->
          <nav class="hidden md:flex gap-3 text-sm">
            <a href="#" class="bg-indigo-400 text-white px-4 py-1 rounded-md"
              >Home</a
            >
            <a href="#" class="bg-indigo-400 text-white px-4 py-1 rounded-md"
              >Galeri</a
            >
            <a href="#" class="bg-indigo-400 text-white px-4 py-1 rounded-md"
              >Kontak</a
            >
          </nav>

          <!-- humberger menu muncul saat di mobile -->
           <button class="md:hidden text-2xl text white">
            ☰
           </button>
        </div>
      </header>
    </div>
  </body>
</html>
