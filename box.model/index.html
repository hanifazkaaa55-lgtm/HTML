<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3: Box Model & Position</title>
    
<link rel="stylesheet" href="style.css">
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>

</head>
<body>
    <div class="container">
        <h1>CSS3: Box Model & Position</h1>
        <hr />
        <!-- buat kolom otomatis dengan class grid -->
         <h2>Bagian 1: Box Model</h2>
        <div class="grid">
            <div class="card">
                <div id="box-a">
                    <p>Box A</p>
                    <p>(Konten Polos)</p>
                </div>
            </div>
            <div class="card">
                <div id="box-b">
                    <p>Box B</p>
                    <p>(Konten + Padding)</p>
                </div>
            </div>
            <div class="card">
                <div id="box-c">
                    <p>Box C</p>
                    <p>(Konten + Padding + Border)</p>
                </div>
            </div>
            <div class="card">
                <div id="box-d">
                    <p>Box D</p>
                    <p>(Konten + Padding + Border + Margin)</p>
                </div>
            </div>
        </div>
    </div>
    <h2>Bagian 2: position</h2>
    <div class="grid">
        <div class="card">box E </div>
        <div class="card">box F </div>
        <div class="card">box G </div>
        <div class="card">box H </div>
    </div>
</body>
</html>
